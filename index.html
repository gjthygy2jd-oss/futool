<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080c12">
<title>楚门 · 期货盯盘</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
margin:0;
background:#080c12;
color:#f5f7fa;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",
"Microsoft YaHei",sans-serif;
}

button,input,select{
font:inherit;
}

button{
cursor:pointer;
}

.app{
max-width:900px;
margin:auto;
padding:14px;
padding-bottom:50px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.logo{
font-size:28px;
font-weight:900;
letter-spacing:1px;
}

.status{
font-size:12px;
color:#7f8b98;
}

.card{
background:#111720;
border:1px solid #202a35;
border-radius:17px;
padding:16px;
margin-bottom:12px;
}

.title{
font-size:15px;
font-weight:800;
margin-bottom:13px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.market{
background:#0b1017;
border:1px solid #202a35;
border-radius:14px;
padding:13px;
}

.market-name{
color:#9ca7b3;
font-size:13px;
}

.price{
font-size:25px;
font-weight:900;
margin-top:6px;
}

.change{
font-size:13px;
margin-top:4px;
}

.up{color:#ff5861}
.down{color:#25d695}
.neutral{color:#9ca7b3}

.signal{
background:#0b1017;
border:1px solid #202a35;
border-radius:14px;
padding:15px;
}

.signal-main{
font-size:25px;
font-weight:900;
}

.signal-sub{
font-size:12px;
color:#8995a2;
margin-top:6px;
}

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:9px;
}

.stat{
background:#0b1017;
border-radius:12px;
padding:12px;
}

.label{
font-size:11px;
color:#7f8b98;
}

.value{
font-size:22px;
font-weight:900;
margin-top:5px;
}

.green{color:#29d391}
.red{color:#ff5962}
.gold{color:#ffd45c}
.blue{color:#62a9ff}

.actions{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.btn{
border:0;
border-radius:12px;
padding:13px 8px;
font-weight:800;
color:white;
background:#26303c;
}

.btn:active{
transform:scale(.98);
}

.btn-long{
background:#087c55;
}

.btn-short{
background:#9d3037;
}

.btn-close{
background:#315b8e;
}

.btn-edit{
background:#5b4a22;
}

.btn-cancel{
background:#542832;
}

.btn-small{
padding:7px 9px;
font-size:12px;
border-radius:8px;
}

.form{
display:grid;
gap:10px;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.field label{
display:block;
font-size:11px;
color:#84909d;
margin-bottom:5px;
}

.field input,
.field select,
.field textarea{
width:100%;
background:#090e14;
border:1px solid #293440;
color:white;
border-radius:10px;
padding:11px;
outline:none;
}

.field textarea{
min-height:70px;
resize:vertical;
}

.direction{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.direction button{
padding:11px;
border-radius:10px;
border:1px solid #303b47;
background:#0b1017;
color:#aab4c0;
font-weight:800;
}

.direction button.active-long{
background:#087c55;
border-color:#29d391;
color:white;
}

.direction button.active-short{
background:#9d3037;
border-color:#ff5962;
color:white;
}

.hidden{
display:none!important;
}

.table-wrap{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:650px;
}

th{
text-align:left;
padding:9px 6px;
font-size:11px;
color:#75818d;
border-bottom:1px solid #222c36;
}

td{
padding:10px 6px;
font-size:12px;
border-bottom:1px solid #19222c;
}

.badge{
display:inline-block;
padding:4px 7px;
border-radius:7px;
font-size:11px;
font-weight:800;
}

.badge-long{
background:#0b5d42;
color:#58e3b2;
}

.badge-short{
background:#6d252b;
color:#ff8990;
}

.badge-open{
background:#273e59;
color:#75b9ff;
}

.badge-closed{
background:#26332b;
color:#86d7ad;
}

.badge-cancelled{
background:#35252a;
color:#9e7d83;
}

.modal-bg{
position:fixed;
inset:0;
background:rgba(0,0,0,.72);
display:flex;
align-items:flex-end;
justify-content:center;
z-index:999;
}

.modal{
width:min(900px,100%);
max-height:92vh;
overflow:auto;
background:#111720;
border-radius:20px 20px 0 0;
padding:18px;
border-top:1px solid #303a45;
}

.modal-title{
font-size:18px;
font-weight:900;
margin-bottom:15px;
}

.modal-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:12px;
}

.empty{
text-align:center;
padding:24px 10px;
color:#6f7a86;
font-size:13px;
}

.footer{
text-align:center;
font-size:10px;
color:#505b67;
margin-top:18px;
}

.toast{
position:fixed;
left:50%;
bottom:25px;
transform:translateX(-50%);
background:#202a35;
border:1px solid #394654;
padding:10px 16px;
border-radius:10px;
font-size:13px;
z-index:2000;
display:none;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
<div class="logo">楚门</div>
<div class="status" id="status">正在连接 D1…</div>
</div>


<!-- 当前信号 -->

<div class="card">

<div class="title">当前信号</div>

<div class="signal" id="currentSignal">

<div class="signal-main neutral">
等待真实行情
</div>

<div class="signal-sub">
暂未接入有效实时信号
</div>

</div>

</div>


<!-- 实时行情 -->

<div class="card">

<div class="title">实时行情</div>

<div class="grid" id="marketGrid">

<div class="empty">
正在读取行情……
</div>

</div>

</div>


<!-- 交易操作 -->

<div class="card">

<div class="title">记录实际交易</div>

<div class="actions">

<button class="btn btn-long"
onclick="openTradeModal('long')">
＋ 做多开仓
</button>

<button class="btn btn-short"
onclick="openTradeModal('short')">
＋ 做空开仓
</button>

</div>

</div>


<!-- 持仓 -->

<div class="card">

<div class="title">当前持仓</div>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>品种</th>
<th>方向</th>
<th>开仓价</th>
<th>手数</th>
<th>时间</th>
<th>操作</th>
</tr>
</thead>

<tbody id="openTrades"></tbody>

</table>

</div>

</div>


<!-- 历史战绩 -->

<div class="card">

<div class="title">
楚门历史战绩 · 最近1000次
</div>

<div class="stats">

<div class="stat">
<div class="label">有效交易</div>
<div class="value blue" id="total">0</div>
</div>

<div class="stat">
<div class="label">胜率</div>
<div class="value gold" id="winRate">—</div>
</div>

<div class="stat">
<div class="label">盈利</div>
<div class="value green" id="wins">0</div>
</div>

<div class="stat">
<div class="label">亏损</div>
<div class="value red" id="losses">0</div>
</div>

<div class="stat">
<div class="label">累计盈亏</div>
<div class="value" id="totalPnl">—</div>
</div>

<div class="stat">
<div class="label">盈亏比</div>
<div class="value blue" id="ratio">—</div>
</div>

<div class="stat">
<div class="label">平均盈利</div>
<div class="value green" id="avgWin">—</div>
</div>

<div class="stat">
<div class="label">平均亏损</div>
<div class="value red" id="avgLoss">—</div>
</div>

</div>

</div>


<!-- 品种统计 -->

<div class="card">

<div class="title">
品种表现
</div>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>品种</th>
<th>交易</th>
<th>盈利</th>
<th>亏损</th>
<th>胜率</th>
<th>盈亏</th>
</tr>
</thead>

<tbody id="productStats"></tbody>

</table>

</div>

</div>


<!-- 历史交易 -->

<div class="card">

<div class="title">
交易记录
</div>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>时间</th>
<th>品种</th>
<th>方向</th>
<th>开仓</th>
<th>平仓</th>
<th>手数</th>
<th>盈亏</th>
<th>状态</th>
<th>操作</th>
</tr>
</thead>

<tbody id="tradeHistory"></tbody>

</table>

</div>

</div>


<div class="footer">
楚门 · Cloudflare Worker · D1
</div>

</div>


<!-- 交易弹窗 -->

<div class="modal-bg hidden" id="modalBg">

<div class="modal">

<div class="modal-title" id="modalTitle">
记录交易
</div>

<div class="form">

<div class="field">

<label>品种</label>

<select id="product">

<option value="菜粕">菜粕</option>
<option value="豆粕">豆粕</option>
<option value="玻璃">玻璃</option>
<option value="纯碱">纯碱</option>

</select>

</div>


<div class="field">

<label>方向</label>

<div class="direction">

<button id="longBtn"
onclick="selectDirection('long')">
做多
</button>

<button id="shortBtn"
onclick="selectDirection('short')">
做空
</button>

</div>

</div>


<div class="row">

<div class="field">

<label>开仓价格</label>

<input
id="openPrice"
type="number"
step="0.01"
placeholder="例如 2500">

</div>


<div class="field">

<label>开仓手数</label>

<input
id="volume"
type="number"
step="1"
min="1"
placeholder="例如 5">

</div>

</div>


<div class="field">

<label>开仓时间</label>

<input
id="openTime"
type="datetime-local">

</div>


<div class="field">

<label>备注</label>

<textarea
id="note"
placeholder="可选"></textarea>

</div>

</div>


<div class="modal-actions">

<button class="btn"
onclick="closeModal()">
取消
</button>

<button class="btn btn-close"
onclick="saveTrade()">
保存
</button>

</div>

</div>

</div>


<!-- 平仓弹窗 -->

<div class="modal-bg hidden" id="closeModalBg">

<div class="modal">

<div class="modal-title">
记录平仓
</div>

<div class="form">

<div class="field">

<label>平仓价格</label>

<input
id="closePrice"
type="number"
step="0.01"
placeholder="实际成交价">

</div>

<div class="field">

<label>平仓手数</label>

<input
id="closeVolume"
type="number"
step="1"
min="1"
placeholder="实际平仓手数">

</div>

<div class="field">

<label>平仓时间</label>

<input
id="closeTime"
type="datetime-local">

</div>

</div>

<div class="modal-actions">

<button class="btn"
onclick="closeCloseModal()">
取消
</button>

<button class="btn btn-close"
onclick="saveClose()">
确认平仓
</button>

</div>

</div>

</div>


<div class="toast" id="toast"></div>


<script>

/* =========================================================
   楚门 API
========================================================= */

const API =
"https://futrade-api.rzkbytrh52.workers.dev";


/* 当前方向 */

let selectedDirection = "long";


/* 当前编辑交易 */

let editingTrade = null;


/* 当前平仓交易 */

let closingTrade = null;


/* =========================================================
   工具
========================================================= */

function $(id){
return document.getElementById(id);
}


function toast(message){

const el = $("toast");

el.textContent = message;

el.style.display = "block";

setTimeout(()=>{
el.style.display="none";
},2200);

}


function num(v){

const n = Number(v);

return Number.isFinite(n) ? n : null;

}


function money(v){

const n = num(v);

if(n === null) return "—";

return n > 0
? "+" + n.toFixed(2)
: n.toFixed(2);

}


function escapeHtml(v){

return String(v ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function nowInput(){

const d = new Date();

const offset =
d.getTimezoneOffset();

const local =
new Date(
d.getTime() -
offset * 60000
);

return local
.toISOString()
.slice(0,16);

}


/* =========================================================
   API 请求
========================================================= */

async function api(url, options={}){

const response =
await fetch(
API + url,
{
...options,
headers:{
"Content-Type":"application/json",
...(options.headers || {})
}
}
);

if(!response.ok){

const text =
await response.text();

throw new Error(
"HTTP " +
response.status +
" " +
text
);

}

return response.json();

}


/* =========================================================
   读取交易
========================================================= */

async function loadTrades(){

try{

const data =
await api("/api/trades");


let trades = [];

if(Array.isArray(data)){
trades=data;
}
else if(Array.isArray(data.data)){
trades=data.data;
}
else if(Array.isArray(data.trades)){
trades=data.trades;
}
else if(Array.isArray(data.results)){
trades=data.results;
}


renderAll(trades);


$("status").textContent =
"D1 已连接 · " +
new Date().toLocaleTimeString();

}
catch(error){

console.error(error);

$("status").textContent =
"D1 连接失败";

}

}


/* =========================================================
   字段兼容
========================================================= */

function getId(t){

return (
t.id ??
t.trade_id ??
t.tradeId
);

}


function getProduct(t){

return (
t.product ??
t.symbol ??
t.instrument ??
t.contract ??
"未知"
);

}


function getDirection(t){

return (
t.direction ??
t.side ??
t.position_direction ??
"long"
);

}


function getOpenPrice(t){

return num(
t.open_price ??
t.openPrice ??
t.entry_price ??
t.entryPrice
);

}


function getClosePrice(t){

return num(
t.close_price ??
t.closePrice ??
t.exit_price ??
t.exitPrice
);

}


function getVolume(t){

return num(
t.volume ??
t.quantity ??
t.lots ??
t.hand
);

}


function getPnl(t){

return num(
t.pnl ??
t.profit ??
t.profit_loss ??
t.profitLoss ??
t.realized_pnl ??
t.realizedPnl
);

}


function getStatus(t){

return (
t.status ??
(
getClosePrice(t) !== null
? "closed"
: "open"
)
);

}


function getTime(t){

return (
t.open_time ??
t.openTime ??
t.created_at ??
t.createdAt ??
t.timestamp ??
""
);

}


/* =========================================================
   保存开仓
========================================================= */

async function saveTrade(){

const product =
$("product").value;

const openPrice =
num($("openPrice").value);

const volume =
num($("volume").value);

const openTime =
$("openTime").value;

if(openPrice === null || openPrice <= 0){

toast("请输入正确的开仓价格");

return;

}

if(volume === null || volume <= 0){

toast("请输入正确的手数");

return;

}


const payload = {

product,

direction:
selectedDirection,

open_price:
openPrice,

volume,

open_time:
openTime || new Date().toISOString(),

status:"open",

note:
$("note").value || ""

};


try{

await api(
"/api/trades",
{
method:"POST",
body:JSON.stringify(payload)
}
);

toast("开仓记录已保存");

closeModal();

await loadTrades();

}
catch(error){

console.error(error);

toast("保存失败，请检查 Worker API");

}

}


/* =========================================================
   修改交易
========================================================= */

async function updateTrade(id){

const payload = {

product:
$("product").value,

direction:
selectedDirection,

open_price:
num($("openPrice").value),

volume:
num($("volume").value),

open_time:
$("openTime").value,

note:
$("note").value || ""

};


try{

await api(
"/api/trades/" +
encodeURIComponent(id),
{
method:"PUT",
body:JSON.stringify(payload)
}
);

toast("交易已修改");

closeModal();

await loadTrades();

}
catch(error){

/*
   如果你的 Worker 暂时没有 PUT，
   这里会提示失败。
*/

console.error(error);

toast("修改失败：Worker 尚未提供 PUT 接口");

}

}


/* =========================================================
   打开交易窗口
========================================================= */

function openTradeModal(direction, trade=null){

editingTrade =
trade;

selectDirection(
direction ||
getDirection(trade) ||
"long"
);


$("modalTitle").textContent =
trade
? "修改交易"
: "记录实际开仓";


if(trade){

$("product").value =
getProduct(trade);

$("openPrice").value =
getOpenPrice(trade) ?? "";

$("volume").value =
getVolume(trade) ?? "";

$("openTime").value =
normalizeDateTime(
getTime(trade)
);

$("note").value =
trade.note || "";

}
else{

$("product").value =
"菜粕";

$("openPrice").value =
"";

$("volume").value =
"";

$("openTime").value =
nowInput();

$("note").value =
"";

}


$("modalBg")
.classList.remove("hidden");

}


function closeModal(){

$("modalBg")
.classList.add("hidden");

editingTrade=null;

}


/* =========================================================
   方向
========================================================= */

function selectDirection(direction){

selectedDirection =
direction;

$("longBtn")
.classList.remove("active-long");

$("shortBtn")
.classList.remove("active-short");


if(direction === "long"){

$("longBtn")
.classList.add("active-long");

}
else{

$("shortBtn")
.classList.add("active-short");

}

}


/* =========================================================
   平仓
========================================================= */

function openCloseModal(trade){

closingTrade =
trade;

$("closePrice").value =
"";

$("closeVolume").value =
getVolume(trade) ?? "";

$("closeTime").value =
nowInput();

$("closeModalBg")
.classList.remove("hidden");

}


function closeCloseModal(){

$("closeModalBg")
.classList.add("hidden");

closingTrade=null;

}


async function saveClose(){

if(!closingTrade){

return;

}

const closePrice =
num($("closePrice").value);

const closeVolume =
num($("closeVolume").value);

if(closePrice === null || closePrice <= 0){

toast("请输入平仓价格");

return;

}

if(closeVolume === null || closeVolume <= 0){

toast("请输入平仓手数");

return;

}


const openPrice =
getOpenPrice(closingTrade);

const direction =
getDirection(closingTrade);

const volume =
getVolume(closingTrade);


let pnl = null;


/*
   注意：
   这里计算的是“价格盈亏”。

   真正人民币盈亏还需要合约乘数。

   因此这里不擅自假设合约乘数。
*/

if(openPrice !== null){

if(direction === "long"){

pnl =
(closePrice - openPrice)
* closeVolume;

}
else{

pnl =
(openPrice - closePrice)
* closeVolume;

}

}


const id =
getId(closingTrade);


const payload = {

close_price:
closePrice,

close_volume:
closeVolume,

close_time:
$("closeTime").value ||
new Date().toISOString(),

status:"closed",

pnl

};


try{

await api(
"/api/trades/" +
encodeURIComponent(id),
{
method:"PUT",
body:JSON.stringify(payload)
}
);

toast("平仓记录已保存");

closeCloseModal();

await loadTrades();

}
catch(error){

console.error(error);

toast("平仓失败：请检查 Worker PUT 接口");

}

}


/* =========================================================
   撤回
========================================================= */

async function cancelTrade(trade){

const id =
getId(trade);

if(id === undefined){

toast("这条记录没有 ID");

return;

}


if(!confirm(
"确定撤回这笔交易吗？\n\n" +
getProduct(trade) +
" · " +
(
getDirection(trade)==="long"
? "做多"
: "做空"
)
)){

return;

}


try{

await api(
"/api/trades/" +
encodeURIComponent(id),
{
method:"PUT",
body:JSON.stringify({
status:"cancelled"
})
}
);

toast("交易已撤回");

await loadTrades();

}
catch(error){

console.error(error);

toast("撤回失败：请检查 Worker PUT 接口");

}

}


/* =========================================================
   日期格式
========================================================= */

function normalizeDateTime(value){

if(!value){

return nowInput();

}

const d =
new Date(value);

if(Number.isNaN(d.getTime())){

return "";

}

const offset =
d.getTimezoneOffset();

const local =
new Date(
d.getTime() -
offset * 60000
);

return local
.toISOString()
.slice(0,16);

}


function formatTime(value){

if(!value){

return "—";

}

const d =
new Date(value);

if(Number.isNaN(d.getTime())){

return escapeHtml(value);

}

return d.toLocaleString(
"zh-CN",
{
month:"2-digit",
day:"2-digit",
hour:"2-digit",
minute:"2-digit"
}
);

}


/* =========================================================
   计算统计
========================================================= */

function calculate(trades){

const completed =
trades
.filter(t =>
getStatus(t) === "closed" &&
getStatus(t) !== "cancelled" &&
getPnl(t) !== null
)
.sort(
(a,b)=>
new Date(getTime(a)) -
new Date(getTime(b))
)
.slice(-1000);


let wins=0;
let losses=0;

let totalPnl=0;
let winAmount=0;
let lossAmount=0;

const products={};


for(const t of completed){

const pnl =
getPnl(t);

totalPnl += pnl;


if(pnl > 0){

wins++;

winAmount += pnl;

}
else if(pnl < 0){

losses++;

lossAmount += Math.abs(pnl);

}


const product =
getProduct(t);

if(!products[product]){

products[product]={
total:0,
wins:0,
losses:0,
pnl:0
};

}


products[product].total++;
products[product].pnl += pnl;


if(pnl>0){

products[product].wins++;

}
else if(pnl<0){

products[product].losses++;

}

}


return {

total:completed.length,

wins,
losses,

winRate:
completed.length
? wins/completed.length*100
: null,

totalPnl,

avgWin:
wins
? winAmount/wins
: null,

avgLoss:
losses
? lossAmount/losses
: null,

ratio:
lossAmount
? winAmount/lossAmount
: null,

products

};

}


/* =========================================================

}

/* =========================================================
   JSON 安全
========================================================= */

function safeJson(obj){

return JSON.stringify(obj)
.replace(/'/g,"&#39;");

}

========================================================= */

function renderStats(s){

$("total").textContent =
s.total;

$("wins").textContent =
s.wins;

$("losses").textContent =
s.losses;

$("winRate").textContent =
s.winRate===null
?"—"
:s.winRate.toFixed(1)+"%";

$("totalPnl").textContent =
money(s.totalPnl);

$("ratio").textContent =
s.ratio===null
?"—"
:s.ratio.toFixed(2);

$("avgWin").textContent =
money(s.avgWin);

$("avgLoss").textContent =
s.avgLoss===null
?"—"
:("-"+s.avgLoss.toFixed(2));


const tbody =
$("productStats");

const names =
Object.keys(s.products);


if(!names.length){

tbody.innerHTML=`
<tr>
<td colspan="6" class="empty">
暂无已完成交易
</td>
</tr>
`;

return;

}


tbody.innerHTML =
names.map(name=>{

const p =
s.products[name];

const rate =
p.total
?p.wins/p.total*100
:0;

return `
<tr>

<td>${escapeHtml(name)}</td>

<td>${p.total}</td>

<td class="green">${p.wins}</td>

<td class="red">${p.losses}</td>

<td>${rate.toFixed(1)}%</td>

<td class="${
p.pnl>0
?"green"
:p.pnl<0
?"red"
:""
}">
${money(p.pnl)}
</td>

</tr>
`;

}).join("");

}
