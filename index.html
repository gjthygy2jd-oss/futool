<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080c12">

<title>楚门 · 期货盯盘</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#080c12;
  color:#e8edf5;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif;
}

body{
  min-height:100vh;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:
    calc(14px + env(safe-area-inset-top))
    14px
    calc(30px + env(safe-area-inset-bottom));
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}

.logo{
  font-size:26px;
  font-weight:800;
  letter-spacing:2px;
}

.status{
  font-size:12px;
  color:#7f8a9b;
  padding:6px 10px;
  border:1px solid #1d2633;
  border-radius:999px;
  background:#0d1219;
}

.section{
  margin-top:14px;
}

.section-title{
  font-size:15px;
  font-weight:700;
  margin:0 0 9px 2px;
  color:#cbd5e1;
}

.card{
  background:#0d1219;
  border:1px solid #1c2531;
  border-radius:16px;
  overflow:hidden;
}

.signal{
  padding:18px;
}

.signal-main{
  font-size:23px;
  font-weight:800;
}

.signal-main.long{
  color:#27d17f;
}

.signal-main.short{
  color:#ff5d6c;
}

.signal-main.neutral{
  color:#aab4c3;
}

.signal-sub{
  margin-top:7px;
  font-size:13px;
  color:#778396;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  padding:10px;
}

.market{
  padding:14px;
  background:#101720;
  border:1px solid #1d2733;
  border-radius:13px;
}

.market-name{
  font-size:14px;
  font-weight:700;
}

.market-price{
  margin-top:10px;
  font-size:22px;
  font-weight:800;
}

.market-change{
  margin-top:4px;
  font-size:12px;
  color:#788496;
}

.market-status{
  margin-top:9px;
  font-size:11px;
  color:#697588;
}

.empty{
  padding:22px;
  text-align:center;
  color:#697588;
  font-size:13px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:12px;
}

.btn{
  border:0;
  border-radius:12px;
  padding:13px 10px;
  font-weight:700;
  color:white;
}

.btn-long{
  background:#137c4b;
}

.btn-short{
  background:#a52e3b;
}

.btn-secondary{
  background:#18212c;
  border:1px solid #293543;
  color:#d9e1ec;
}

.btn-danger{
  background:#57212a;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:600px;
}

th,
td{
  padding:11px 10px;
  border-bottom:1px solid #1b2430;
  text-align:left;
  font-size:12px;
  white-space:nowrap;
}

th{
  color:#718096;
  font-weight:600;
}

td{
  color:#d8e0eb;
}

.long-text{
  color:#28d17f;
}

.short-text{
  color:#ff6573;
}

.pnl-profit{
  color:#28d17f;
  font-weight:700;
}

.pnl-loss{
  color:#ff6573;
  font-weight:700;
}

.pnl-zero{
  color:#8793a4;
}

.row-actions{
  display:flex;
  gap:6px;
}

.small-btn{
  border:1px solid #293543;
  background:#141c25;
  color:#dbe3ee;
  border-radius:8px;
  padding:6px 9px;
  font-size:11px;
}

.small-btn.red{
  color:#ff7a85;
  border-color:#51242b;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  padding:10px;
}

.stat{
  background:#101720;
  border:1px solid #1d2733;
  border-radius:12px;
  padding:13px;
}

.stat-label{
  font-size:11px;
  color:#718096;
}

.stat-value{
  margin-top:7px;
  font-size:20px;
  font-weight:800;
}

.modal-bg{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.62);
  padding:12px;
}

.modal{
  width:100%;
  max-width:520px;
  background:#10161e;
  border:1px solid #26303d;
  border-radius:20px;
  padding:18px;
  padding-bottom:calc(18px + env(safe-area-inset-bottom));
}

.modal-title{
  font-size:19px;
  font-weight:800;
  margin-bottom:16px;
}

.form-row{
  margin-bottom:12px;
}

.form-row label{
  display:block;
  font-size:12px;
  color:#7e8a9b;
  margin-bottom:6px;
}

.form-row input,
.form-row textarea,
.form-row select{
  width:100%;
  background:#0a0f15;
  color:#edf2f7;
  border:1px solid #27313e;
  border-radius:10px;
  padding:11px 12px;
  outline:none;
}

.form-row textarea{
  min-height:70px;
  resize:vertical;
}

.direction{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.direction button{
  border:1px solid #2a3542;
  background:#121923;
  color:#9ba7b7;
  border-radius:10px;
  padding:11px;
}

.direction button.active-long{
  background:#124c35;
  border-color:#198557;
  color:#4ee69a;
}

.direction button.active-short{
  background:#54232b;
  border-color:#9d3544;
  color:#ff7b87;
}

.modal-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:15px;
}

.hidden{
  display:none !important;
}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(28px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:200;
  background:#edf2f7;
  color:#0a0f15;
  border-radius:999px;
  padding:9px 15px;
  font-size:12px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.toast.show{
  opacity:1;
}

@media(max-width:500px){
  .grid{
    grid-template-columns:1fr 1fr;
  }

  .market-price{
    font-size:19px;
  }

  table{
    min-width:680px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">楚门</div>
    <div class="status" id="status">正在连接 D1…</div>
  </div>

  <!-- 当前信号 -->
  <div class="section">
    <div class="section-title">当前信号</div>

    <div class="card">
      <div class="signal" id="currentSignal">
        <div class="signal-main neutral">等待真实行情</div>
        <div class="signal-sub">暂未接入有效实时信号</div>
      </div>
    </div>
  </div>

  <!-- 实时行情 -->
  <div class="section">
    <div class="section-title">实时行情</div>

    <div class="card">
      <div class="grid" id="marketGrid"></div>
    </div>
  </div>

  <!-- 记录交易 -->
  <div class="section">
    <div class="section-title">记录实际交易</div>

    <div class="card">
      <div class="actions">
        <button class="btn btn-long" onclick="openTradeModal('long')">
          ＋ 做多开仓
        </button>

        <button class="btn btn-short" onclick="openTradeModal('short')">
          ＋ 做空开仓
        </button>
      </div>
    </div>
  </div>

  <!-- 当前持仓 -->
  <div class="section">
    <div class="section-title">当前持仓</div>

    <div class="card table-wrap">
      <table>
        <thead>
          <tr>
            <th>品种</th>
            <th>方向</th>
            <th>开仓价</th>
            <th>手数</th>
            <th>开仓时间</th>
            <th>备注</th>
            <th>操作</th>
          </tr>
        </thead>

        <tbody id="openTrades"></tbody>
      </table>
    </div>
  </div>

  <!-- 历史战绩 -->
  <div class="section">
    <div class="section-title">历史战绩 · 最近1000次</div>

    <div class="card">
      <div class="stats" id="historyStats"></div>
    </div>
  </div>

  <!-- 品种表现 -->
  <div class="section">
    <div class="section-title">品种表现</div>

    <div class="card table-wrap">
      <table>
        <thead>
          <tr>
            <th>品种</th>
            <th>交易次数</th>
            <th>盈利次数</th>
            <th>亏损次数</th>
            <th>胜率</th>
            <th>价格盈亏</th>
          </tr>
        </thead>

        <tbody id="productStats"></tbody>
      </table>
    </div>
  </div>

  <!-- 交易记录 -->
  <div class="section">
    <div class="section-title">交易记录</div>

    <div class="card table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>品种</th>
            <th>方向</th>
            <th>开仓价</th>
            <th>平仓价</th>
            <th>手数</th>
            <th>盈亏</th>
            <th>状态</th>
            <th>开仓时间</th>
            <th>操作</th>
          </tr>
        </thead>

        <tbody id="tradeHistory"></tbody>
      </table>
    </div>
  </div>

</div>

<!-- 开仓/编辑弹窗 -->
<div class="modal-bg hidden" id="modalBg">
  <div class="modal">

    <div class="modal-title" id="modalTitle">记录开仓</div>

    <div class="form-row">
      <label>品种</label>

      <select id="product">
        <option value="菜粕">菜粕</option>
        <option value="豆粕">豆粕</option>
        <option value="玻璃">玻璃</option>
        <option value="纯碱">纯碱</option>
      </select>
    </div>

    <div class="form-row">
      <label>方向</label>

      <div class="direction">
        <button id="longBtn" onclick="selectDirection('long')">
          做多
        </button>

        <button id="shortBtn" onclick="selectDirection('short')">
          做空
        </button>
      </div>
    </div>

    <div class="form-row">
      <label>开仓价格</label>
      <input id="openPrice" type="number" step="any" placeholder="请输入开仓价格">
    </div>

    <div class="form-row">
      <label>手数</label>
      <input id="volume" type="number" min="1" step="1" value="1">
    </div>

    <div class="form-row">
      <label>开仓时间</label>
      <input id="openTime" type="datetime-local">
    </div>

    <div class="form-row">
      <label>备注</label>
      <textarea id="note" placeholder="可填写策略、原因等"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">
        取消
      </button>

      <button class="btn btn-long" onclick="saveTrade()">
        保存
      </button>
    </div>

  </div>
</div>

<!-- 平仓弹窗 -->
<div class="modal-bg hidden" id="closeModalBg">
  <div class="modal">

    <div class="modal-title">记录平仓</div>

    <div class="form-row">
      <label>平仓价格</label>
      <input id="closePrice" type="number" step="any" placeholder="请输入平仓价格">
    </div>

    <div class="form-row">
      <label>平仓手数</label>
      <input id="closeVolume" type="number" min="1" step="1">
    </div>

    <div class="form-row">
      <label>平仓时间</label>
      <input id="closeTime" type="datetime-local">
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeCloseModal()">
        取消
      </button>

      <button class="btn btn-short" onclick="saveClose()">
        确认平仓
      </button>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>

/* =========================================================
   楚门 Worker API
   ========================================================= */

const API = "https://futrade-api.rzkbytrh52.workers.dev";


/* =========================================================
   全局状态
   ========================================================= */

let selectedDirection = "long";
let editingTrade = null;
let closingTrade = null;
let allTrades = [];


/* =========================================================
   工具函数
   ========================================================= */

function $(id){
  return document.getElementById(id);
}


function toast(message){

  const el = $("toast");

  el.textContent = message;
  el.classList.add("show");

  clearTimeout(window.__toastTimer);

  window.__toastTimer = setTimeout(() => {
    el.classList.remove("show");
  }, 2200);
}


function num(v){

  const n = Number(v);

  return Number.isFinite(n) ? n : 0;
}


function money(v){

  const n = num(v);

  if(n > 0){
    return "+" + n.toFixed(2);
  }

  return n.toFixed(2);
}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}


function nowInput(){

  const d = new Date();

  const pad = n => String(n).padStart(2,"0");

  return (
    d.getFullYear() +
    "-" +
    pad(d.getMonth()+1) +
    "-" +
    pad(d.getDate()) +
    "T" +
    pad(d.getHours()) +
    ":" +
    pad(d.getMinutes())
  );
}


function normalizeDateTime(value){

  if(!value){
    return "";
  }

  const d = new Date(value);

  if(Number.isNaN(d.getTime())){
    return "";
  }

  const pad = n => String(n).padStart(2,"0");

  return (
    d.getFullYear() +
    "-" +
    pad(d.getMonth()+1) +
    "-" +
    pad(d.getDate()) +
    "T" +
    pad(d.getHours()) +
    ":" +
    pad(d.getMinutes())
  );
}


function formatTime(value){

  if(!value){
    return "—";
  }

  const d = new Date(value);

  if(Number.isNaN(d.getTime())){
    return String(value);
  }

  return d.toLocaleString("zh-CN",{
    year:"numeric",
    month:"2-digit",
    day:"2-digit",
    hour:"2-digit",
    minute:"2-digit"
  });
}


/* =========================================================
   API
   ========================================================= */

async function api(path, options = {}){

  const response = await fetch(API + path,{
    ...options,
    headers:{
      "Content-Type":"application/json",
      ...(options.headers || {})
    }
  });

  const text = await response.text();

  let data = null;

  try{
    data = text ? JSON.parse(text) : null;
  }catch{
    data = text;
  }

  if(!response.ok){

    const message =
      data?.error ||
      data?.message ||
      "API请求失败";

    throw new Error(message);
  }

  return data;
}


/* =========================================================
   字段兼容
   ========================================================= */

function getId(t){
  return t.id;
}


function getProduct(t){

  return (
    t.product ??
    t.symbol ??
    t.instrument ??
    t.contract ??
    "未知"
  );
}


function getDirection(t){

  return t.direction === "short"
    ? "short"
    : "long";
}


function getOpenPrice(t){

  return num(
    t.open_price ??
    t.openPrice ??
    t.price
  );
}


function getClosePrice(t){

  if(
    t.close_price === null ||
    t.close_price === undefined ||
    t.close_price === ""
  ){
    return 0;
  }

  return num(t.close_price);
}


function getVolume(t){

  return num(
    t.volume ??
    t.open_volume ??
    0
  );
}


function getCloseVolume(t){

  if(
    t.close_volume === null ||
    t.close_volume === undefined
  ){
    return 0;
  }

  return num(t.close_volume);
}


function getPnl(t){

  if(
    t.pnl === null ||
    t.pnl === undefined ||
    t.pnl === ""
  ){
    return 0;
  }

  return num(t.pnl);
}


function getStatus(t){

  if(t.status){
    return t.status;
  }

  if(
    t.close_price !== null &&
    t.close_price !== undefined
  ){
    return "closed";
  }

  return "open";
}


function getTime(t){

  return (
    t.open_time ??
    t.openTime ??
    t.create_time ??
    t.createTime ??
    ""
  );
}


/* =========================================================
   加载交易
   ========================================================= */

async function loadTrades(){

  try{

    const data = await api("/api/trades");

    if(Array.isArray(data)){
      allTrades = data;
    }else if(Array.isArray(data?.results)){
      allTrades = data.results;
    }else{
      allTrades = [];
    }

    $("status").textContent =
      "D1 已连接 · " +
      new Date().toLocaleTimeString("zh-CN");

    renderAll(allTrades);

  }catch(error){

    console.error(error);

    $("status").textContent = "D1连接失败";

    toast("读取交易数据失败：" + error.message);
  }
}


/* =========================================================
   保存交易
   ========================================================= */

async function saveTrade(){

  const product = $("product").value;
  const direction = selectedDirection;
  const openPrice = num($("openPrice").value);
  const volume = Number($("volume").value);
  const openTime =
    $("openTime").value
      ? new Date($("openTime").value).toISOString()
      : new Date().toISOString();

  const note = $("note").value || "";

  if(!product){
    toast("请选择品种");
    return;
  }

  if(!Number.isFinite(openPrice) || openPrice <= 0){
    toast("请输入有效的开仓价格");
    return;
  }

  if(!Number.isInteger(volume) || volume <= 0){
    toast("请输入有效的手数");
    return;
  }

  const body = {
    product,
    direction,
    open_price:openPrice,
    volume,
    open_time:openTime,
    note
  };


  try{

    /* =========================
       编辑 → PUT
       ========================= */

    if(editingTrade){

      const id = getId(editingTrade);

      await api("/api/trades/" + id,{
        method:"PUT",
        body:JSON.stringify(body)
      });

      toast("交易修改成功");

    }else{

      /* =========================
         新开仓 → POST
         ========================= */

      await api("/api/trades",{
        method:"POST",
        body:JSON.stringify(body)
      });

      toast("开仓记录成功");
    }

    closeModal();

    await loadTrades();

  }catch(error){

    console.error(error);

    toast("保存失败：" + error.message);
  }
}


/* =========================================================
   修改交易
   ========================================================= */

async function updateTrade(id){

  const trade = allTrades.find(
    t => String(getId(t)) === String(id)
  );

  if(!trade){
    toast("找不到交易");
    return;
  }

  openTradeModal(
    getDirection(trade),
    trade
  );
}


/* =========================================================
   打开开仓弹窗
   ========================================================= */

function openTradeModal(direction,trade=null){

  editingTrade = trade;

  $("modalTitle").textContent =
    trade ? "修改交易" : "记录开仓";

  $("product").value =
    trade
      ? getProduct(trade)
      : "菜粕";

  $("openPrice").value =
    trade
      ? getOpenPrice(trade)
      : "";

  $("volume").value =
    trade
      ? getVolume(trade)
      : 1;

  $("openTime").value =
    trade
      ? normalizeDateTime(getTime(trade))
      : nowInput();

  $("note").value =
    trade
      ? (trade.note || "")
      : "";

  selectDirection(
    trade
      ? getDirection(trade)
      : direction
  );

  $("modalBg").classList.remove("hidden");
}


function closeModal(){

  $("modalBg").classList.add("hidden");

  editingTrade = null;
}


/* =========================================================
   方向选择
   ========================================================= */

function selectDirection(direction){

  selectedDirection = direction;

  const longBtn = $("longBtn");
  const shortBtn = $("shortBtn");

  longBtn.className = "";
  shortBtn.className = "";

  if(direction === "long"){
    longBtn.classList.add("active-long");
  }else{
    shortBtn.classList.add("active-short");
  }
}


/* =========================================================
   平仓
   ========================================================= */

function openCloseModal(trade){

  closingTrade = trade;

  $("closePrice").value = "";

  $("closeVolume").value =
    getVolume(trade);

  $("closeTime").value =
    nowInput();

  $("closeModalBg").classList.remove("hidden");
}


function closeCloseModal(){

  $("closeModalBg").classList.add("hidden");

  closingTrade = null;
}


async function saveClose(){

  if(!closingTrade){
    return;
  }

  const id = getId(closingTrade);

  const closePrice =
    num($("closePrice").value);

  const closeVolume =
    Number($("closeVolume").value);

  const closeTime =
    $("closeTime").value
      ? new Date($("closeTime").value).toISOString()
      : new Date().toISOString();

  if(!Number.isFinite(closePrice) || closePrice <= 0){
    toast("请输入有效的平仓价格");
    return;
  }

  if(
    !Number.isInteger(closeVolume) ||
    closeVolume <= 0 ||
    closeVolume > getVolume(closingTrade)
  ){
    toast("平仓手数无效");
    return;
  }

  try{

    await api("/api/trades/" + id,{
      method:"PUT",
      body:JSON.stringify({
        status:"closed",
        close_price:closePrice,
        close_volume:closeVolume,
        close_time:closeTime
      })
    });

    toast("平仓成功");

    closeCloseModal();

    await loadTrades();

  }catch(error){

    console.error(error);

    toast("平仓失败：" + error.message);
  }
}


/* =========================================================
   撤销
   ========================================================= */

async function cancelTrade(trade){

  const id = getId(trade);

  const ok = confirm(
    "确定撤销这笔交易记录吗？"
  );

  if(!ok){
    return;
  }

  try{

    await api("/api/trades/" + id,{
      method:"PUT",
      body:JSON.stringify({
        status:"cancelled"
      })
    });

    toast("交易已撤销");

    await loadTrades();

  }catch(error){

    console.error(error);

    toast("撤销失败：" + error.message);
  }
}


/* =========================================================
   总渲染
   ========================================================= */

function renderAll(trades){

  renderOpenTrades(trades);
  renderHistory(trades);
  renderStats(trades);
}


/* =========================================================
   当前持仓
   ========================================================= */

function renderOpenTrades(trades){

    trades.filter(
      t => getStatus(t) === "open"

          </div>
        </td>
      </tr>
    `;

    return;

  tbody.innerHTML =
    openTrades.map(trade => {

      const direction =
        getDirection(trade);

      const directionText =
        direction === "long"

          : "做空";

      const directionClass =
        direction === "long"
          ? "long-text"
          : "short-text";

      return `
        <tr>

          <td>
            ${escapeHtml(getProduct(trade))}
          </td>

          <td class="${directionClass}">
            ${directionText}
          </td>

          <td>
            ${getOpenPrice(trade).toFixed(2)}
          </td>

          <td>
            ${getVolume(trade)}
          </td>

          <td>
            ${escapeHtml(formatTime(getTime(trade)))}
          </td>

          <td>
            ${escapeHtml(trade.note || "—")}
          </td>

          <td>
            <div class="row-actions">

              <button
                class="small-btn"
                onclick="updateTrade(${Number(getId(trade))})">
                修改
              </button>

              <button
                class="small-btn"
                onclick="openCloseModalById(${Number(getId(trade))})">
                平仓
              </button>

              <button
                class="small-btn red"
                onclick="cancelTradeById(${Number(getId(trade))})">
                撤销
              </button>

            </div>
          </td>

        </tr>
      `;

    }).join("");
}


/* =========================================================
   根据ID找到交易
   ========================================================= */

function openCloseModalById(id){

  const trade = allTrades.find(
    t => String(getId(t)) === String(id)
  );

  if(trade){
    openCloseModal(trade);
  }
}


function cancelTradeById(id){

  const trade = allTrades.find(
    t => String(getId(t)) === String(id)
  );

  if(trade){
    cancelTrade(trade);
  }
}


/* =========================================================
   历史记录
   ========================================================= */

function renderHistory(trades){

  const tbody = $("tradeHistory");

  const list =
    trades
      .filter(t => getStatus(t) !== "open")
      .slice(0,1000);

  if(!list.length){

    tbody.innerHTML = `
      <tr>
        <td colspan="10">
          <div class="empty">
            暂无历史交易
          </div>
        </td>
      </tr>
    `;

    return;
  }


  tbody.innerHTML =
    list.map(trade => {

      const direction =
        getDirection(trade);

      const directionText =
        direction === "long"
          ? "做多"
          : "做空";

      const directionClass =
        direction === "long"
          ? "long-text"
          : "short-text";

      const status =
        getStatus(trade);

      const statusText =
        status === "closed"
          ? "已平仓"
          : status === "cancelled"
            ? "已撤销"
            : status;

      const pnl =
        status === "closed"
          ? getPnl(trade)
          : 0;

      let pnlClass = "pnl-zero";

      if(pnl > 0){
        pnlClass = "pnl-profit";
      }else if(pnl < 0){
        pnlClass = "pnl-loss";
      }

      const closePrice =
        getClosePrice(trade);

      return `
        <tr>

          <td>${escapeHtml(getId(trade))}</td>

          <td>
            ${escapeHtml(getProduct(trade))}
          </td>

          <td class="${directionClass}">
            ${directionText}
          </td>

          <td>
            ${getOpenPrice(trade).toFixed(2)}
          </td>

          <td>
            ${
              closePrice
                ? closePrice.toFixed(2)
                : "—"
            }
          </td>

          <td>
            ${
              getCloseVolume(trade) ||
              getVolume(trade)
            }
          </td>

          <td class="${pnlClass}">
            ${
              status === "closed"
                ? money(pnl)
                : "—"
            }
          </td>

          <td>
            ${statusText}
          </td>

          <td>
            ${escapeHtml(formatTime(getTime(trade)))}
          </td>

          <td>
            ${
              status === "closed"
                ? "—"
                : `
                  <button
                    class="small-btn"
                    onclick="updateTrade(${Number(getId(trade))})">
                    查看
                  </button>
                `
            }
          </td>

        </tr>
      `;

    }).join("");
}


/* =========================================================
   历史统计
   ========================================================= */

function calculate(trades){

  const closed =
    trades
      .filter(
        t => getStatus(t) === "closed"
      )
      .slice(0,1000);

  const total = closed.length;

  const wins =
    closed.filter(
      t => getPnl(t) > 0
    ).length;

  const losses =
    closed.filter(
      t => getPnl(t) < 0
    ).length;

  const flat =
    closed.filter(
      t => getPnl(t) === 0
    ).length;

  const totalPnl =
    closed.reduce(
      (sum,t) => sum + getPnl(t),
      0
    );

  const winRate =
    total
      ? wins / total * 100
      : 0;

  return {
    total,
    wins,
    losses,
    flat,
    totalPnl,
    winRate
  };
}


/* =========================================================
   历史统计显示
   ========================================================= */

function renderHistoryStats(stats){

  $("historyStats").innerHTML = `

    <div class="stat">
      <div class="stat-label">
        总交易
      </div>
      <div class="stat-value">
        ${stats.total}
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">
        胜率
      </div>
      <div class="stat-value">
        ${stats.winRate.toFixed(1)}%
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">
        盈利次数
      </div>
      <div class="stat-value pnl-profit">
        ${stats.wins}
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">
        亏损次数
      </div>
      <div class="stat-value pnl-loss">
        ${stats.losses}
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">
        持平次数
      </div>
      <div class="stat-value">
        ${stats.flat}
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">
        价格盈亏
      </div>
      <div class="stat-value ${
        stats.totalPnl > 0
          ? "pnl-profit"
          : stats.totalPnl < 0
            ? "pnl-loss"
            : "pnl-zero"
      }">
        ${money(stats.totalPnl)}
      </div>
    </div>

  `;
}


/* =========================================================
   品种统计
   ========================================================= */

function renderProductStats(trades){

  const tbody = $("productStats");

  const closed =
    trades.filter(
      t => getStatus(t) === "closed"
    );


  const map = {};

  closed.forEach(trade => {

    const product =
      getProduct(trade);

    if(!map[product]){

      map[product] = {
        total:0,
        wins:0,
        losses:0,
        pnl:0
      };

    }

    map[product].total += 1;

    const pnl =
      getPnl(trade);

    if(pnl > 0){
      map[product].wins += 1;
    }else if(pnl < 0){
      map[product].losses += 1;
    }

    map[product].pnl += pnl;

  });


  const products =
    Object.keys(map);


  if(!products.length){

    tbody.innerHTML = `
      <tr>
        <td colspan="6">
          <div class="empty">
            暂无品种战绩
          </div>
        </td>
      </tr>
    `;

    return;
  }


  tbody.innerHTML =
    products.map(product => {

      const s = map[product];

      const winRate =
        s.total
          ? s.wins / s.total * 100
          : 0;

      const pnlClass =
        s.pnl > 0
          ? "pnl-profit"
          : s.pnl < 0
            ? "pnl-loss"
            : "pnl-zero";

      return `
        <tr>

          <td>
            ${escapeHtml(product)}
          </td>

          <td>
            ${s.total}
          </td>

          <td class="pnl-profit">
            ${s.wins}
          </td>

          <td class="pnl-loss">
            ${s.losses}
          </td>

          <td>
            ${winRate.toFixed(1)}%
          </td>

          <td class="${pnlClass}">
            ${money(s.pnl)}
          </td>

        </tr>
      `;

    }).join("");
}


/* =========================================================
   统计总入口
   ========================================================= */

function renderStats(trades){

  const stats =
    calculate(trades);

  renderHistoryStats(stats);

  renderProductStats(trades);
}
