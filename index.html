<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070a0f">

<title>楚门 · 期货智能盯盘</title>

<style>
:root{
  --bg:#070a0f;
  --card:#10151d;
  --card2:#151c26;
  --line:#27313e;
  --text:#f4f7fb;
  --muted:#8e9aaa;
  --up:#20d38a;
  --down:#ff5570;
  --warn:#ffc857;
  --blue:#5aa7ff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:
    linear-gradient(180deg,#070a0f 0%,#0b1017 100%);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "PingFang SC",
    sans-serif;
}

header{
  padding:
    calc(env(safe-area-inset-top) + 14px)
    16px
    12px;

  position:sticky;
  top:0;
  z-index:10;

  background:rgba(7,10,15,.90);
  backdrop-filter:blur(18px);

  border-bottom:1px solid var(--line);
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-size:25px;
  font-weight:900;
  letter-spacing:2px;
}

.status{
  display:flex;
  align-items:center;
  gap:6px;

  color:var(--up);
  font-size:12px;
}

.dot{
  width:7px;
  height:7px;

  border-radius:50%;
  background:var(--up);

  box-shadow:0 0 10px var(--up);
}

.sub{
  margin-top:5px;

  color:var(--muted);
  font-size:12px;
}

main{
  max-width:760px;
  margin:auto;

  padding:
    12px
    12px
    calc(35px + env(safe-area-inset-bottom));
}

.section-title{
  margin:
    18px 3px 9px;

  font-size:17px;
  font-weight:800;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card{
  background:
    linear-gradient(
      145deg,
      var(--card),
      #0d1219
    );

  border:1px solid var(--line);
  border-radius:16px;

  padding:14px;

  box-shadow:
    0 8px 30px rgba(0,0,0,.15);
}

.card.hot{
  border-color:#344252;
}

.name{
  font-size:15px;
  font-weight:800;
}

.code{
  margin-left:5px;
  color:var(--muted);
  font-size:11px;
}

.price{
  margin:9px 0 2px;

  font-size:27px;
  font-weight:900;
}

.change{
  font-size:13px;
  font-weight:700;
}

.up{
  color:var(--up);
}

.down{
  color:var(--down);
}

.neutral{
  color:var(--muted);
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.mini{
  margin-top:11px;

  color:var(--muted);
  font-size:11px;
}

.mini b{
  color:var(--text);
  font-size:12px;
}

.bar{
  height:7px;

  margin-top:8px;

  background:#202833;
  border-radius:99px;
  overflow:hidden;
}

.fill{
  height:100%;
  border-radius:99px;

  background:
    linear-gradient(
      90deg,
      var(--down),
      var(--warn),
      var(--up)
    );
}

.signal{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.direction{
  margin-top:5px;

  font-size:22px;
  font-weight:900;
}

.score{
  font-size:30px;
  font-weight:900;
}

.level{
  display:inline-block;

  padding:4px 7px;

  border-radius:8px;

  background:#202833;
  color:var(--warn);

  font-size:11px;
  font-weight:700;
}

.details{
  display:grid;
  grid-template-columns:
    repeat(2,1fr);

  gap:8px;

  margin-top:12px;
}

.kv{
  background:var(--card2);

  padding:10px;

  border-radius:10px;
}

.kv span{
  display:block;

  margin-bottom:4px;

  color:var(--muted);
  font-size:10px;
}

.kv b{
  font-size:13px;
}

.reason{
  margin-top:10px;

  color:var(--muted);

  font-size:12px;
  line-height:1.65;
}

.news{
  padding:12px 0;

  border-bottom:1px solid var(--line);
}

.news:last-child{
  border-bottom:0;
}

.tag{
  margin-right:6px;

  padding:2px 5px;

  border:
    1px solid var(--line);

  border-radius:5px;

  color:var(--blue);
  font-size:10px;
}

.news p{
  margin:7px 0 3px;

  font-size:13px;
  line-height:1.5;
}

.time{
  color:var(--muted);
  font-size:10px;
}

.notice{
  padding:10px 2px;

  color:var(--muted);

  font-size:11px;
  line-height:1.55;
}

.system-row{
  display:flex;
  justify-content:space-between;

  padding:9px 0;

  border-bottom:1px solid var(--line);

  font-size:12px;
}

.system-row:last-child{
  border-bottom:0;
}

.system-label{
  color:var(--muted);
}

.system-value{
  font-weight:700;
}

@media(min-width:650px){

  .grid{
    grid-template-columns:
      repeat(4,1fr);
  }

  .details{
    grid-template-columns:
      repeat(4,1fr);
  }
}
</style>
</head>


<body>

<header>

  <div class="top">

    <div class="brand">
      楚门
    </div>

    <div class="status">

      <span class="dot"></span>

      <span id="status">
        初始化
      </span>

    </div>

  </div>

  <div class="sub">
    期货智能盯盘 · 行情 / 资金 / 趋势 / 新闻综合评分
  </div>

</header>


<main>

  <!-- =========================
       实时盘面
  ========================== -->

  <div class="section-title">
    实时盘面
  </div>

  <div
    id="market"
    class="grid">
  </div>


  <!-- =========================
       楚门交易信号
  ========================== -->

  <div class="section-title">
    楚门交易信号
  </div>

  <div id="signals">
  </div>


  <!-- =========================
       新闻
  ========================== -->

  <div class="section-title">
    实时新闻
  </div>

  <div class="card">

    <div id="news">
    </div>

    <div class="notice">

      新闻模块必须接入真实新闻源。
      未接入真实数据时，系统不会将示例信息显示为实时新闻。

    </div>

  </div>


  <!-- =========================
       系统状态
  ========================== -->

  <div class="section-title">
    系统状态
  </div>

  <div class="card">

    <div class="system-row">

      <span class="system-label">
        行情刷新
      </span>

      <span
        class="system-value"
        id="tick">
        —
      </span>

    </div>


    <div class="system-row">

      <span class="system-label">
        评分引擎
      </span>

      <span
        class="system-value"
        id="scoreStatus">
        正常
      </span>

    </div>


    <div class="system-row">

      <span class="system-label">
        新闻引擎
      </span>

      <span
        class="system-value"
        id="newsStatus">
        等待真实数据
      </span>

    </div>


    <div class="system-row">

      <span class="system-label">
        最后计算
      </span>

      <span
        class="system-value"
        id="last">
        —
      </span>

    </div>

  </div>

</main>


<script>

/*
==========================================================
                     楚门核心系统
==========================================================

当前版本：

① 手机端盯盘界面
② 菜粕
③ 豆粕
④ 玻璃
⑤ 纯碱
⑥ 综合评分框架
⑦ 多空方向
⑧ 信号等级
⑨ 新闻接口
⑩ 实时行情接口

注意：

目前没有把任何虚假行情写入系统。

真正运行时：

行情 → 后端 → 数据清洗 → 评分 → 风控 → 前端

API KEY 不应该直接写在 HTML 中。
*/


/* ========================================================
                       品种
======================================================== */

const products = [

  {
    name:"菜粕",
    code:"RM",

    price:null,
    change:null,

    trend:50,
    fund:50,
    volume:50,

    technical:50,
    news:50,
    risk:50
  },

  {
    name:"豆粕",
    code:"M",

    price:null,
    change:null,

    trend:50,
    fund:50,
    volume:50,

    technical:50,
    news:50,
    risk:50
  },

  {
    name:"玻璃",
    code:"FG",

    price:null,
    change:null,

    trend:50,
    fund:50,
    volume:50,

    technical:50,
    news:50,
    risk:50
  },

  {
    name:"纯碱",
    code:"SA",

    price:null,
    change:null,

    trend:50,
    fund:50,
    volume:50,

    technical:50,
    news:50,
    risk:50
  }

];


/* ========================================================
                     楚门评分
======================================================== */

/*
评分结构：

趋势       25%
主力资金   25%
成交       15%
技术结构   15%
新闻       10%
风险过滤   10%

最终：

0 ~ 29      强空
30 ~ 44     偏空
45 ~ 55     观望
56 ~ 69     偏多
70 ~ 100    强多

后续可以进一步升级为动态权重。
*/

function calculateScore(p){

  const score =

      p.trend     * 0.25 +

      p.fund      * 0.25 +

      p.volume    * 0.15 +

      p.technical * 0.15 +

      p.news      * 0.10 +

      p.risk      * 0.10;


  return Math.round(
    Math.max(
      0,
      Math.min(
        100,
        score
      )
    )
  );
}


/* ========================================================
                     多空方向
======================================================== */

function getDirection(score){

  if(score >= 70){
    return "做多";
  }

  if(score <= 30){
    return "做空";
  }

  if(score >= 56){
    return "偏多";
  }

  if(score <= 44){
    return "偏空";
  }

  return "观望";
}


/* ========================================================
                     信号强度
======================================================== */

function getSignalLevel(score){

  if(
    score >= 80 ||
    score <= 20
  ){
    return "强信号";
  }

  if(
    score >= 70 ||
    score <= 30
  ){
    return "关注";
  }

  return "观望";
}


/* ========================================================
                     颜色
======================================================== */

function getClass(direction){

  if(
    direction === "做多" ||
    direction === "偏多"
  ){
    return "up";
  }

  if(
    direction === "做空" ||
    direction === "偏空"
  ){
    return "down";
  }

  return "neutral";
}


/* ========================================================
                    市场卡片
======================================================== */

function renderMarket(){

  const container =
    document.getElementById("market");


  container.innerHTML =
    products.map(p => {

      const score =
        calculateScore(p);

      const direction =
        getDirection(score);

      const cls =
        getClass(direction);


      const price =
        p.price === null
        ? "等待数据"
        : Number(p.price).toFixed(2);


      let changeText = "—";


      if(p.change !== null){

        changeText =
          (p.change >= 0 ? "+" : "") +
          Number(p.change).toFixed(2) +
          "%";

      }


      return `

        <div class="card hot">

          <div>

            <span class="name">
              ${p.name}
            </span>

            <span class="code">
              ${p.code}
            </span>

          </div>


          <div class="price">

            ${price}

          </div>


          <div
            class="change ${
              p.change === null
              ? "neutral"
              : p.change >= 0
                ? "up"
                : "down"
            }">

            ${changeText}

          </div>


          <div class="mini row">

            <span>
              楚门评分
            </span>

            <b class="${cls}">
              ${score}
            </b>

          </div>


          <div class="bar">

            <div
              class="fill"
              style="width:${score}%">
            </div>

          </div>


          <div class="mini row">

            <span>
              方向
            </span>

            <b class="${cls}">
              ${direction}
            </b>

          </div>

        </div>

      `;

    }).join("");

}


/* ========================================================
                    信号卡片
======================================================== */

function renderSignals(){

  const container =
    document.getElementById("signals");


  const ranked =
    [...products].sort(
      (a,b) =>
        calculateScore(b) -
        calculateScore(a)
    );


  container.innerHTML =
    ranked.map(p => {

      const score =
        calculateScore(p);

      const direction =
        getDirection(score);

      const level =
        getSignalLevel(score);

      const cls =
        getClass(direction);


      return `

        <div
          class="card"
          style="margin-bottom:10px">


          <div class="signal">

            <div>

              <div class="name">

                ${p.name}

                <span class="level">
                  ${level}
                </span>

              </div>


              <div
                class="direction ${cls}">

                ${direction}

              </div>

            </div>


            <div>

              <div
                style="
                color:var(--muted);
                font-size:10px">

                综合评分

              </div>


              <div
                class="score ${cls}">

                ${score}

              </div>

            </div>

          </div>


          <div class="details">


            <div class="kv">

              <span>
                趋势
              </span>

              <b>
                ${p.trend}/100
              </b>

            </div>


            <div class="kv">

              <span>
                主力资金
              </span>

              <b>
                ${p.fund}/100
              </b>

            </div>


            <div class="kv">

              <span>
                成交
              </span>

              <b>
                ${p.volume}/100
              </b>

            </div>


            <div class="kv">

              <span>
                技术结构
              </span>

              <b>
                ${p.technical}/100
              </b>

            </div>


          </div>


          <div class="reason">

            当前信号由趋势、
            主力资金、
            成交量、
            技术结构、
            新闻影响及风险因素综合计算。

          </div>


        </div>

      `;

    }).join("");

}


/* ========================================================
                     新闻显示
======================================================== */

function renderNews(items){

  const container =
    document.getElementById("news");


  if(
    !items ||
    items.length === 0
  ){

    container.innerHTML = `

      <div class="news">

        <p class="neutral">
          暂无已连接的实时新闻数据。
        </p>

      </div>

    `;

    return;
  }


  container.innerHTML =
    items.map(n => `

      <div class="news">

        <div>

          <span class="tag">
            ${n.source || "新闻"}
          </span>

          <span class="time">
            ${n.time || ""}
          </span>

        </div>


        <p>
          ${n.title}
        </p>

      </div>

    `).join("");

}


/* ========================================================
                    真实行情接口
======================================================== */

/*

正式版本：

async function fetchMarketData(){

  const response =
    await fetch(
      "https://你的服务器/api/market"
    );

  const data =
    await response.json();

  return data;
}

返回格式建议：

[
  {
    name:"豆粕",
    code:"M",
    price:3150,
    change:1.28,

    trend:82,
    fund:76,
    volume:71,

    technical:79,
    news:68,
    risk:72
  }
]

*/


async function fetchMarketData(){

  /*
    当前没有连接真实行情源。

    所以这里不伪造价格。
  */

  return null;

}


/* ========================================================
                     新闻接口
======================================================== */

/*

新闻服务器建议返回：

[
  {
    source:"Reuters",
    time:"07:30",
    title:"真实新闻标题",
    impact:"bullish",
    strength:80
  }
]

然后楚门再把新闻影响转换为：

news = 0 ~ 100

*/

async function fetchNews(){

  /*
    当前没有连接真实新闻 API。
  */

  return [];

}


/* ========================================================
                   更新真实行情
======================================================== */

async function updateMarket(){

  const data =
    await fetchMarketData();


  if(!data){
    return;
  }


  for(
    const item of data
  ){

    const target =
      products.find(
        p =>
          p.code === item.code
      );


    if(!target){
      continue;
    }


    Object.assign(
      target,
      item
    );

  }

}


/* ========================================================
                     主刷新程序
======================================================== */

async function refresh(){

  try{

    await updateMarket();


    const news =
      await fetchNews();


    renderNews(news);


    document
      .getElementById("status")
      .textContent =
      "监测中";


    document
      .getElementById("newsStatus")
      .textContent =
      news.length
      ? "实时运行"
      : "等待真实数据";


  }catch(error){

    document
      .getElementById("status")
      .textContent =
      "数据源异常";


    document
      .getElementById("newsStatus")
      .textContent =
      "连接异常";


    console.error(
      "楚门数据异常:",
      error
    );

  }


  const now =
    new Date();


  const time =
    now.toLocaleTimeString(
      "zh-CN",
      {
        hour12:false
      }
    );


  document
    .getElementById("tick")
    .textContent =
    time;


  document
    .getElementById("last")
    .textContent =
    time;


  renderMarket();

  renderSignals();

}


/* ========================================================
                     启动
======================================================== */

renderMarket();

renderSignals();

renderNews([]);


/*
  2秒刷新一次。

  注意：

  这个只是前端刷新频率。

  真正的实时行情应该由后端
  使用 WebSocket / 行情推送获取。

  新闻也应该独立抓取，
  不应该因为新闻请求拖慢行情。
*/

refresh();

setInterval(
  refresh,
  2000
);

</script>

</body>
</html>
